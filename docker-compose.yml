version: '3.8'

services:
  next-live-v4:
    build: .
    container_name: next_live_automation_v4
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - WEB_HOST=0.0.0.0
      - WEB_PORT=5000
    deploy:
      resources:
        limits:
          cpus: '0.000' # No hard limit, full vCPU access
          memory: 8G
